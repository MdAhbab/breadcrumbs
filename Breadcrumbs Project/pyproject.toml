[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breadcrumbs"
version = "1.0.0"
description = "A permissioned ledger for verifiable factory records, with a Continuity Gate governing a shared detector"
requires-python = ">=3.10,<3.13"
dependencies = [
    "cryptography>=42",
    "numpy>=2.0",
]

[project.optional-dependencies]
# The learning plane. Split out so the ledger can be installed and tested
# without pulling ~2 GB of PyTorch — useful in CI and on a small machine.
ml = ["torch>=2.2", "flwr[simulation]>=1.9"]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["model*"]

[tool.pytest.ini_options]
testpaths = ["model/tests", "backend/tests"]
pythonpath = [".", "backend"]
addopts = "-q"
markers = ["slow: trains models; takes tens of seconds"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = [
    "E501",    # long lines are handled by the formatter, not the linter
    "B008",    # FastAPI's Depends() in a default argument is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately import things only to prove they are reachable.
"model/tests/*" = ["B011"]
"model/experiments/*" = ["ALL"]   # frozen: backs published numbers, must not change
