<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0C1425" />
    <meta name="description" content="Breadcrumbs — a permissioned ledger that makes a factory's own records provable without publishing them." />
    <title>Breadcrumbs — Prove one line. Reveal nothing else.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!--
      The boot screen. Inline because it must paint before a single byte of CSS
      or JS arrives; a blank white viewport while the bundle and Fraunces load
      is the one moment of the product nobody designed. The hex values are the
      only ones outside tokens.css, and they are duplicated here on purpose:
      a stylesheet cannot be waited on by the thing that covers the wait.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 22px;
        background: #0c1425;
        color: #f4f1e8;
        transition: opacity 240ms ease-out;
      }
      #boot.is-done { opacity: 0; pointer-events: none; }
      .boot__mark {
        font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif;
        font-weight: 600;
        font-size: 23px;
        letter-spacing: -0.02em;
      }
      .boot__thread {
        width: min(220px, 44vw);
        height: 1px;
        background: rgba(184, 147, 74, 0.22);
        overflow: hidden;
      }
      /* A selvedge forming: the thread draws across, then unwinds back. */
      .boot__thread i {
        display: block;
        height: 100%;
        background: #b8934a;
        transform-origin: left center;
        animation: boot-draw 1250ms cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot-draw {
        0% { transform: scaleX(0); transform-origin: left center; }
        48% { transform: scaleX(1); transform-origin: left center; }
        52% { transform: scaleX(1); transform-origin: right center; }
        100% { transform: scaleX(0); transform-origin: right center; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__thread i { animation: none; transform: scaleX(1); }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <span class="boot__mark">Breadcrumbs</span>
      <span class="boot__thread"><i></i></span>
    </div>
    <div id="root"></div>
    <script>
      // Failsafe: a bundle that never mounts must not leave the reader staring
      // at a boot screen for ever.
      setTimeout(function () {
        var b = document.getElementById('boot');
        if (b) { b.classList.add('is-done'); setTimeout(function () { b.remove(); }, 300); }
      }, 6000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
